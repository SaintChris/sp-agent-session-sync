name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq sqlite3 shellcheck
      - name: Shellcheck
        run: shellcheck -S warning sp-session-sync.sh sp-api tests/run-tests.sh tests/e2e-test.sh
      - name: Parser and skip-rule tests
        run: bash tests/run-tests.sh
      - name: End-to-end test (fake API, no model call)
        run: bash tests/e2e-test.sh
